[project]
name = "beautybooking-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tainguyen04", email = "huutai18102004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.3",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.2",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[project.scripts]
beautybooking-fastapi = "beautybooking_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
